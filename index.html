<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<title>Sonos Remote · Home Assistant</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-display: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --tw-pad: 20px;
    --tw-gap: 18px;
    --tw-radius: 16px;
    --tw-bg: halo;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    color: #fff;
  }
  #root { position: fixed; inset: 0; }
  .album-art { user-select: none; }
  *::selection { background: rgba(255,126,96,.3); }
</style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
