<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Sonos Remote · Home Assistant</title>

<!-- PWA: install as a standalone fullscreen app -->
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
<link rel="apple-touch-icon" href="icons/icon.svg" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Sonos" />
<meta name="application-name" content="Sonos" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;540;600;700&family=Geist+Mono:wght@400;500&display=swap">

<style>
  :root {
    --font-ui: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-display: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --tw-pad: 20px;
    --tw-gap: 18px;
    --tw-radius: 16px;
    --tw-bg: halo;
  }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body {
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    color: #fff;
  }
  #root { position: fixed; inset: 0; }
  .album-art { user-select: none; }
  *::selection { background: rgba(255,126,96,.3); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <!--
    Cache-buster: bump V on every release. All local scripts load with ?v=V
    so browsers and PWAs pull fresh code without needing a manual hard-refresh.
    Change this one line whenever you push an update.
  -->
  <script>
    window.SONOS_V = '8';
    (function () {
      const V = window.SONOS_V;
      // Register the service worker (required for Android Chrome to show
      // "Install app" when adding to home screen). No-op fetch handler.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=' + V).catch(() => {});
      }
      const PLAIN = ['src/data.js', 'src/album-color.js', 'src/ha-client.js'];
      const JSX = [
        'src/icons.jsx', 'src/state.jsx', 'src/common.jsx',
        'src/obsidian.jsx', 'src/obsidian-mobile.jsx',
        'src/ha-bridge.jsx', 'src/setup.jsx', 'src/app.jsx',
      ];
      function loadPlain(src) {
        return new Promise((resolve, reject) => {
          const s = document.createElement('script');
          s.src = src + '?v=' + V;
          s.async = false;
          s.onload = resolve;
          s.onerror = reject;
          document.head.appendChild(s);
        });
      }
      async function boot() {
        for (const src of PLAIN) await loadPlain(src);
        for (const src of JSX) {
          const s = document.createElement('script');
          s.src = src + '?v=' + V;
          s.type = 'text/babel';
          document.body.appendChild(s);
        }
        // Babel processes type=text/babel script tags on DOMContentLoaded;
        // for tags added after that, trigger transformation manually.
        if (window.Babel && Babel.transformScriptTags) Babel.transformScriptTags();
      }
      boot();
    })();
  </script>
</body>
</html>
